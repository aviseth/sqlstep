name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    # A tag can be pushed at a commit whose CI never ran or went red. Publishing
    # is the one irreversible step here, so the tests run again on the way out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync
      # SQLite only here; the PostgreSQL tests skip without SQLSTEP_TEST_DSN
      # and the full matrix has already run them on the pull request.
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: the tag has to match the version being built
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project --with tomli python -c \
            'import tomli,pathlib;print(tomli.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME would publish version $version" >&2
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
