[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlstep"
version = "0.1.0"
description = "Plain SQL database migrations, without an ORM. Checksums, locking, dry runs and honest transaction handling."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Avi Seth", email = "avi@crispa.ai" }]
keywords = ["migrations", "sql", "postgres", "sqlite", "database", "schema", "ddl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["tomli>=2.0; python_version<'3.11'"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/aviseth/sqlstep"
Repository = "https://github.com/aviseth/sqlstep"
Changelog = "https://github.com/aviseth/sqlstep/blob/main/CHANGELOG.md"
Issues = "https://github.com/aviseth/sqlstep/issues"

[project.scripts]
sqlstep = "sqlstep.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7", "mypy>=1.11", "psycopg[binary]>=3.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sqlstep"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: needs a PostgreSQL server (SQLSTEP_TEST_DSN)"]
